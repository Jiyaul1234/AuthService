name: Build and deploy ASP.Net Core app to Azure Web App - AuthenticationService

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build Ecommerce.AuthService/Ecommerce.AuthService.API\Ecommerce.AuthService.API.csproj --configuration Release

      - name: Publish
        run: dotnet publish Ecommerce.AuthService/Ecommerce.AuthService.API\Ecommerce.AuthService.API.csproj -c Release -o ./myapp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./myapp

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./myapp

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_91AC17FCB14B48598B6C59065E8C0110 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_70D24BD829734333A71EF3522A89C5C6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_00307F4962364242944CC682D9CA0D99 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AuthenticationService'
          slot-name: 'Production'
          package: ./myapp