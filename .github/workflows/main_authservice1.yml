# Build and deploy ASP.Net Core app to Azure Web App - AuthService1
name: Build and deploy ASP.Net Core app to Azure Web App - AuthService1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Find solution file
        id: find-sln
        shell: bash
        run: |
          sln=$(git ls-files '*.sln' | head -n1 || true)
          if [ -z "$sln" ]; then
            echo "No .sln file found in the repo."
            exit 1
          fi
          echo "Found solution: $sln"
          echo "sln=$sln" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore "${{ steps.find-sln.outputs.sln }}"

      - name: Build solution
        run: dotnet build "${{ steps.find-sln.outputs.sln }}" --configuration Release --no-restore

      - name: Find API project file
        id: find-api
        shell: bash
        run: |
          api=$(git ls-files '*Ecommerce.AuthService.API.csproj' | head -n1 || true)
          # fallback to any project ending with .API.csproj
          if [ -z "$api" ]; then
            api=$(git ls-files '*.API.csproj' | head -n1 || true)
          fi
          if [ -z "$api" ]; then
            echo "No API csproj found."
            exit 1
          fi
          echo "Found API project: $api"
          echo "api=$api" >> $GITHUB_OUTPUT

      - name: Publish web project
        run: dotnet publish "${{ steps.find-api.outputs.api }}" -c Release -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B85306331BA34AA68644CEEF5F3527D1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_61C543DBD5DF4F59BBFBE6C1A5BACD66 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_23FC64C56D594E24AE58CD7FABBE32B8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AuthService1'
          slot-name: 'Production'
          package: ./publish